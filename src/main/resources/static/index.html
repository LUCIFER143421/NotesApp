<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotesApp API</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101828;
            color: #f8fafc;
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card {
            width: min(720px, 100%);
            background: #1f2937;
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }
        h1 { margin-top: 0; }
        code {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 2px 6px;
            border-radius: 6px;
        }
        form { display: grid; gap: 12px; margin-top: 16px; }
        input, button {
            border-radius: 8px;
            border: 1px solid #475569;
            padding: 10px 12px;
            font-size: 14px;
        }
        button {
            background: #2563eb;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .muted { color: #cbd5e1; }
        pre {
            white-space: pre-wrap;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            min-height: 48px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>NotesApp is running ✅</h1>
    <p class="muted">This project is a REST API. Use these endpoints:</p>
    <ul>
        <li>Register: <code>POST /auth/register</code></li>
        <li>Login: <code>POST /auth/login</code></li>
        <li>Health check: <code>GET /ping</code></li>
    </ul>

    <h2>Quick register form</h2>
    <form id="registerForm">
        <input id="username" type="text" placeholder="username" required />
        <input id="password" type="password" placeholder="password" required />
        <button type="submit">Register</button>
    </form>

    <p class="muted">Response:</p>
    <pre id="result">Waiting for request...</pre>
</div>

<script>
    const form = document.getElementById('registerForm');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        result.textContent = 'Submitting...';

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const text = await response.text();
            result.textContent = `${response.status} ${response.statusText}\n${text}`;
        } catch (error) {
            result.textContent = `Request failed: ${error.message}`;
        }
    });
</script>
</body>
</html>
